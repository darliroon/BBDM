# Conditional Latent Brownian Bridge Diffusion Model (f4, 备选方案)
# 与 Template-CBBDM.yaml (像素空间) 的区别: 桥在 VQGAN f4 潜空间 (256² -> 64²)
# 警告: A/B 为 2-3px 细线图, VQGAN 压缩可能丢失细线!
# 使用前务必先验证 VQGAN 对车道线图的重建质量 (encode->decode 后线是否连续)
runner: "BBDMRunner"
training:
  n_epochs: 100
  n_steps: 200000
  save_interval: 2
  sample_interval: 2
  validation_interval: 2
  accumulate_grad_batches: 4

testing:
  clip_denoised: False
  sample_num: 5
  # guidance_scale: 1.5

data:
  dataset_name: 'lane_lines'
  dataset_type: 'custom_triple'
  dataset_config:
    dataset_path: 'dataset_path'
    image_size: 256
    channels: 3
    to_normal: True
    flip: True
  train:
    batch_size: 8
    shuffle: True
  val:
    batch_size: 8
    shuffle: True
  test:
    batch_size: 8

model:
  model_name: "CBBDM-L-f4"
  model_type: "LBBDM"
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False
  # model_load_path:
  # optim_sche_load_path:

  EMA:
    use_ema: True
    ema_decay: 0.995
    update_ema_interval: 8
    start_ema_step: 30000

  CondStageParams:            # ImageContextEncoder: 图C -> cross-attn tokens (C 不经 VQGAN)
    in_channels: 3
    width: 128
    context_dim: 512
    token_grid: 32
    num_blocks: 3

  VQGAN:
    params:
      ckpt_path: 'results/VQGAN/vq-f4.ckpt'   # LDM 预训练 VQGAN
      embed_dim: 3
      n_embed: 8192
      ddconfig:
        double_z: false
        z_channels: 3
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult: !!python/tuple
          - 1
          - 2
          - 4
        num_res_blocks: 2
        attn_resolutions: [ ]
        dropout: 0.0

      lossconfig:
        target: torch.nn.Identity

  BB:
    optimizer:
      weight_decay: 0.000
      optimizer: 'Adam'
      lr: 1.e-4
      beta1: 0.9

    lr_scheduler:
      factor: 0.5
      patience: 3000
      threshold: 0.0001
      cooldown: 3000
      min_lr: 5.e-7

    params:
      mt_type: 'linear'
      objective: 'grad'
      loss_type: 'l1'

      skip_sample: True
      sample_type: 'linear'
      sample_step: 200

      num_timesteps: 1000
      eta: 1.0
      max_var: 1.0
      cond_dropout: 0.1

      UNetParams:
        image_size: 64             # 潜空间分辨率
        in_channels: 3
        model_channels: 128
        out_channels: 3
        num_res_blocks: 2
        attention_resolutions: !!python/tuple
          - 32
          - 16
          - 8
        channel_mult: !!python/tuple
          - 1
          - 4
          - 8
        conv_resample: True
        dims: 2
        num_heads: 8
        num_head_channels: 64
        use_scale_shift_norm: True
        resblock_updown: True
        use_spatial_transformer: True
        context_dim: 512
        transformer_depth: 1
        condition_key: "ImageContext"
